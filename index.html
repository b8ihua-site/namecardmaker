<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>名札作成ツール</title>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Kosugi Maru', sans-serif;
  background: #f5f5f5;
  color: #222;
  min-height: 100vh;
}

header {
  background: #fff;
  border-bottom: 1px solid #ddd;
  padding: 14px 16px 10px;
  position: sticky;
  top: 0;
  z-index: 10;
}
header h1 { font-size: 1rem; font-weight: 700; letter-spacing: .04em; }
header p  { font-size: .72rem; color: #888; margin-top: 2px; }

.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 16px 14px 80px;
}

.howto {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 18px;
  font-size: .78rem;
  color: #555;
  line-height: 1.8;
}
.howto strong { display: block; font-size: .8rem; color: #222; margin-bottom: 6px; }
.howto ol { padding-left: 1.4em; }

.person-card {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 14px 14px 10px;
  margin-bottom: 10px;
}
.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.card-num { font-size: .7rem; color: #888; background: #f0f0f0; padding: 2px 10px; border-radius: 20px; }
.btn-remove {
  background: none; border: 1px solid #ccc; color: #999;
  font-size: .78rem; padding: 3px 10px; border-radius: 4px;
  cursor: pointer; font-family: inherit;
}
.btn-remove:active { background: #f0f0f0; }

label { display: block; font-size: .68rem; color: #888; margin-bottom: 4px; }
input[type="text"] {
  width: 100%; border: 1px solid #ddd; border-radius: 6px;
  padding: 9px 11px; font-size: 1rem; font-family: inherit;
  color: #222; background: #fafafa; outline: none;
  margin-bottom: 10px; -webkit-appearance: none;
}
input[type="text"]:focus { border-color: #888; background: #fff; }
input.furigana { font-size: .9rem; }

.btn-add {
  width: 100%; padding: 12px; border: 1.5px dashed #ccc;
  border-radius: 10px; background: none; color: #888;
  font-size: .9rem; font-family: inherit; cursor: pointer; margin-bottom: 12px;
}
.btn-add:active { background: #f0f0f0; }

.btn-print {
  width: 100%; padding: 14px; background: #222; color: #fff;
  border: none; border-radius: 10px; font-size: 1rem;
  font-family: inherit; font-weight: 700; letter-spacing: .06em; cursor: pointer;
}
.btn-print:active { background: #000; }

/* 印刷エリアは画面非表示 */
.print-area { display: none; }

@media print {
  @page { size: A4 portrait; margin: 10mm; }
  body, html { background: #fff; }
  header, .container { display: none !important; }

  .print-area {
    display: block !important;
  }

  .print-page {
    display: grid;
    grid-template-columns: 89mm 89mm;
    width: 178mm;
    border-top: 0.3mm solid #bbb;
    border-left: 0.3mm solid #bbb;
    page-break-after: always;
    break-after: page;
  }

  .print-page:last-child {
    page-break-after: avoid;
    break-after: avoid;
  }

  .badge {
    display: flex !important;
    width: 89mm;
    height: 43mm;
    border-right: 0.3mm solid #bbb;
    border-bottom: 0.3mm solid #bbb;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    page-break-inside: avoid;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    background: #fff;
    padding: 1.5mm 3mm;
    gap: 0.5mm;
    overflow: hidden;
  }

  .badge .badge-furigana {
    font-family: 'Kosugi Maru', sans-serif;
    font-size: 7.5pt;
    color: #555;
    letter-spacing: .15em;
    text-align: center;
    flex-shrink: 0;
  }

  .badge .badge-name {
    font-family: 'Kosugi Maru', sans-serif;
    color: #111;
    letter-spacing: .06em;
    text-align: center;
    line-height: 1.0;
    word-break: break-all;
    /* font-sizeはJS側でインラインstyleで設定 */
  }
}

.btn-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.btn-add {
  margin-bottom: 0;
}
.btn-csv {
  width: 100%; padding: 12px; border: 1.5px solid #ccc;
  border-radius: 10px; background: #fff; color: #444;
  font-size: .9rem; font-family: inherit; cursor: pointer;
}
.btn-csv:active { background: #f0f0f0; }
.csv-note {
  font-size: .75rem; color: #555; background: #f0f0f0;
  border-radius: 6px; padding: 8px 12px; margin-bottom: 12px;
}
</style>
</head>
<body>

<header>
  <h1>名札作成ツール</h1>
  <p>縦43 × 横89 mm</p>
</header>

<div class="container">
  <div class="howto">
    <strong>📋 使い方</strong>
    <ol>
      <li>名前とふりがなを入力してください</li>
      <li>「＋ 人を追加」で人数分増やせます</li>
      <li>「印刷する」を押してA4用紙に印刷してください（2列、最大12人/枚）</li>
      <li>灰色の枠線に沿ってハサミで切ってご使用ください</li>
      <li>CSVは「名前,ふりがな」を1行1人で作成してください（ヘッダー行不要）</li>
    </ol>
  </div>

  <div id="cards"></div>
  <div class="btn-row">
    <button class="btn-add" onclick="addPerson()">＋ 人を追加</button>
    <button class="btn-csv" onclick="document.getElementById('csvInput').click()">📂 CSVを読み込む</button>
  </div>
  <input type="file" id="csvInput" accept=".csv,text/csv" style="display:none" onchange="importCSV(this)">
  <div id="csvNote" class="csv-note" style="display:none"></div>
  <button class="btn-print" onclick="window.print()">🖨 印刷する</button>
</div>

<!-- 印刷専用（画面非表示） -->
<div class="print-area" id="printArea"></div>

<script>
let people = [
  { name: '山田 太郎', furigana: 'やまだ たろう' },
  { name: '鈴木 花子', furigana: 'すずき はなこ' },
];


function importCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const lines = e.target.result
      .split(/\r?\n/)
      .map(l => l.trim())
      .filter(l => l.length > 0);

    const imported = [];
    const errors = [];
    lines.forEach((line, idx) => {
      // カンマで分割（最初のカンマのみ）
      const comma = line.indexOf(',');
      if (comma === -1) {
        errors.push(`${idx+1}行目: カンマが見つかりません`);
        return;
      }
      const name     = line.slice(0, comma).trim();
      const furigana = line.slice(comma + 1).trim();
      if (!name) { errors.push(`${idx+1}行目: 名前が空です`); return; }
      imported.push({ name, furigana });
    });

    if (imported.length > 0) {
      people = imported;
      render();
    }

    const note = document.getElementById('csvNote');
    if (errors.length > 0) {
      note.style.display = 'block';
      note.textContent = `${imported.length}人を読み込みました。スキップ: ${errors.join(' / ')}`;
    } else {
      note.style.display = 'block';
      note.textContent = `✅ ${imported.length}人を読み込みました`;
      setTimeout(() => { note.style.display = 'none'; }, 3000);
    }
    // 同じファイルを再度選べるようリセット
    input.value = '';
  };
  reader.readAsText(file, 'UTF-8');
}

function addPerson() {
  people.push({ name: '', furigana: '' });
  render();
  setTimeout(() => {
    const cards = document.querySelectorAll('.person-card');
    if (cards.length) cards[cards.length-1].scrollIntoView({behavior:'smooth',block:'center'});
  }, 50);
}

function removePerson(i) {
  if (people.length === 1) return;
  people.splice(i, 1);
  render();
}

function update(i, field, val) {
  people[i][field] = val;
  renderPrintArea();
}

function render() {
  renderCards();
  renderPrintArea();
}

function renderCards() {
  document.getElementById('cards').innerHTML = people.map((p, i) => `
    <div class="person-card">
      <div class="card-top">
        <span class="card-num">${i+1} 人目</span>
        <button class="btn-remove" onclick="removePerson(${i})">削除</button>
      </div>
      <label>ふりがな</label>
      <input class="furigana" type="text" value="${esc(p.furigana)}"
        placeholder="やまだ たろう"
        oninput="update(${i},'furigana',this.value)"
        inputmode="hiragana">
      <label>名前</label>
      <input type="text" value="${esc(p.name)}"
        placeholder="山田 太郎"
        oninput="update(${i},'name',this.value)">
    </div>
  `).join('');
}

function renderPrintArea() {
  const PER_PAGE = 12;
  const pages = [];
  for (let i = 0; i < people.length; i += PER_PAGE) {
    pages.push(people.slice(i, i + PER_PAGE));
  }
  document.getElementById('printArea').innerHTML = pages.map(group => {
    const badges = group.map(p => `
      <div class="badge">
        <div class="badge-furigana" style="font-size:15pt">${esc(p.furigana) || '&nbsp;'}</div>
        <div class="badge-name" style="font-size:37pt">${esc(p.name) || '&nbsp;'}</div>
      </div>`).join('');
    return `<div class="print-page">${badges}</div>`;
  }).join('');
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
