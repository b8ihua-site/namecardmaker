<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名札作成ツール</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap');
  :root {
    --bg: #f0f0f0; --surface: #fff; --border: #ccc;
    --text: #111; --text-muted: #666;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans JP','Hiragino Kaku Gothic ProN','Meiryo',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  header { background:#222; color:#fff; padding:14px 28px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:1rem; font-weight:500; letter-spacing:.06em; }
  header span { font-size:.8rem; color:#aaa; margin-left:auto; }
  .app { display:grid; grid-template-columns:380px 1fr; min-height:calc(100vh - 48px); }
  .panel { background:var(--surface); border-right:1px solid var(--border); padding:20px; overflow-y:auto; }
  .panel-title { font-size:.68rem; font-weight:700; letter-spacing:.1em; color:#444; text-transform:uppercase; margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid var(--border); }
  .person-card { border:1px solid var(--border); border-radius:6px; padding:14px; margin-bottom:10px; background:#fafafa; }
  .card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .card-num { font-size:.68rem; font-weight:700; color:#555; background:#e8e8e8; padding:2px 8px; border-radius:20px; }
  .btn-remove { background:none; border:1px solid #ccc; color:#888; cursor:pointer; font-size:.85rem; padding:1px 7px; border-radius:4px; transition:all .15s; }
  .btn-remove:hover { border-color:#999; color:#333; background:#eee; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .form-row.full { grid-template-columns:1fr; }
  label { display:block; font-size:.65rem; color:var(--text-muted); margin-bottom:3px; font-weight:500; }
  input, select { width:100%; border:1px solid var(--border); border-radius:4px; padding:6px 8px; font-size:.85rem; font-family:inherit; background:#fff; color:var(--text); outline:none; transition:border-color .15s; }
  input:focus, select:focus { border-color:#555; }
  .btn-add { width:100%; padding:10px; border:1.5px dashed #bbb; border-radius:6px; background:none; color:#888; font-size:.85rem; font-family:inherit; cursor:pointer; transition:all .2s; margin-bottom:16px; }
  .btn-add:hover { border-color:#666; color:#333; background:#f5f5f5; }
  .btn-print { width:100%; padding:12px; background:#222; color:#fff; border:none; border-radius:6px; font-size:.92rem; font-family:inherit; font-weight:600; cursor:pointer; letter-spacing:.05em; transition:background .15s; }
  .btn-print:hover { background:#000; }
  .preview { padding:28px; overflow-y:auto; }
  .preview-header { display:flex; align-items:baseline; gap:12px; margin-bottom:20px; }
  .preview-title { font-size:.68rem; font-weight:700; letter-spacing:.1em; color:#444; text-transform:uppercase; }
  .badge-note { font-size:.7rem; color:#999; }
  .badges-grid { display:flex; flex-wrap:wrap; gap:18px; }

  /* 名札本体：縦56mm×横89mm、プレビュー1.2倍 */
  /* 96dpi: 1mm=3.7795px → 56mm≒212px, 89mm≒336px; ×1.2→254×403 */
  .badge {
    width:403px; height:254px;
    background:#fff; border:1px solid #888;
    overflow:hidden; display:flex; flex-direction:row;
    font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Meiryo',sans-serif;
    flex-shrink:0;
  }
  .badge-side {
    width:64px; background:#fff; border-right:2px solid #222;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; padding:12px 6px; flex-shrink:0;
  }
  .badge-grade-text { font-size:14px; font-weight:700; color:#111; letter-spacing:.05em; writing-mode:vertical-rl; text-orientation:mixed; }
  .badge-dept-text  { font-size:24px; font-weight:700; color:#111; writing-mode:vertical-rl; text-orientation:mixed; }
  .badge-main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px 20px; gap:8px; }
  .badge-furigana { font-size:12px; color:#444; letter-spacing:.18em; font-weight:400; }
  .badge-name { font-size:44px; font-weight:700; color:#111; letter-spacing:.08em; text-align:center; line-height:1.1; word-break:break-all; }

  @media print {
    @page { size:A4 portrait; margin:10mm; }
    body { background:#fff; }
    header, .panel, .preview-header { display:none !important; }
    .app { display:block; }
    .preview { padding:0; }
    .badges-grid { display:flex; flex-wrap:wrap; gap:4mm; justify-content:flex-start; }
    .badge { width:89mm; height:56mm; border:0.3mm solid #555; page-break-inside:avoid; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .badge-side { width:14mm; border-right:0.4mm solid #222; padding:3mm 2mm; gap:2mm; }
    .badge-grade-text { font-size:7pt; }
    .badge-dept-text  { font-size:11pt; }
    .badge-main { padding:4mm 5mm; gap:2mm; }
    .badge-furigana { font-size:6.5pt; letter-spacing:.12em; }
    .badge-name { font-size:22pt; }
  }
</style>
</head>
<body>
<header>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-4 0v2"/></svg>
  <h1>名札作成ツール</h1>
  <span>縦56 × 横89 mm</span>
</header>
<div class="app">
  <div class="panel">
    <div class="panel-title">参加者情報の入力</div>
    <div id="cards"></div>
    <button class="btn-add" onclick="addPerson()">＋ 人を追加</button>
    <button class="btn-print" onclick="window.print()">🖨　印刷する</button>
  </div>
  <div class="preview">
    <div class="preview-header">
      <div class="preview-title">プレビュー</div>
      <div class="badge-note">実寸 縦56 × 横89mm で印刷されます</div>
    </div>
    <div class="badges-grid" id="badges"></div>
  </div>
</div>
<script>
  const currentYear = new Date().getFullYear();
  const maxKi = currentYear - 1983;
  const gradeOptions = ['1年','2年','3年','4年','5年','6年'];
  const kiOptions = Array.from({length:maxKi},(_,i)=>`${i+1}期`);
  const deptOptions = ['医','看'];

  let people = [
    {grade:'1年',dept:'医',name:'山田 太郎',furigana:'やまだ たろう'},
    {grade:'2年',dept:'看',name:'鈴木 花子',furigana:'すずき はなこ'},
  ];

  function addPerson(){people.push({grade:'1年',dept:'医',name:'',furigana:''});render();}
  function removePerson(i){if(people.length===1)return;people.splice(i,1);render();}
  function update(i,field,val){people[i][field]=val;renderBadges();}
  function render(){renderCards();renderBadges();}

  function renderCards(){
    document.getElementById('cards').innerHTML=people.map((p,i)=>`
      <div class="person-card">
        <div class="card-header">
          <span class="card-num">No.${i+1}</span>
          <button class="btn-remove" onclick="removePerson(${i})">削除</button>
        </div>
        <div class="form-row">
          <div>
            <label>学年</label>
            <select onchange="update(${i},'grade',this.value)">
              <optgroup label="学年">
                ${gradeOptions.map(g=>`<option${p.grade===g?' selected':''}>${g}</option>`).join('')}
              </optgroup>
              <optgroup label="期（卒業生等）">
                ${kiOptions.map(g=>`<option${p.grade===g?' selected':''}>${g}</option>`).join('')}
              </optgroup>
            </select>
          </div>
          <div>
            <label>学科</label>
            <select onchange="update(${i},'dept',this.value)">
              ${deptOptions.map(d=>`<option${p.dept===d?' selected':''}>${d}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="form-row full">
          <div><label>ふりがな</label><input type="text" value="${esc(p.furigana)}" placeholder="やまだ たろう" oninput="update(${i},'furigana',this.value)"></div>
        </div>
        <div class="form-row full">
          <div><label>名前（漢字）</label><input type="text" value="${esc(p.name)}" placeholder="山田 太郎" oninput="update(${i},'name',this.value)"></div>
        </div>
      </div>`).join('');
  }

  function renderBadges(){
    document.getElementById('badges').innerHTML=people.map(p=>`
      <div class="badge">
        <div class="badge-side">
          <div class="badge-grade-text">${esc(p.grade)}</div>
          <div class="badge-dept-text">${esc(p.dept)}</div>
        </div>
        <div class="badge-main">
          <div class="badge-furigana">${esc(p.furigana)||'&nbsp;'}</div>
          <div class="badge-name">${esc(p.name)||'<span style="color:#ccc;font-size:24px">名前未入力</span>'}</div>
        </div>
      </div>`).join('');
  }

  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  render();
</script>
</body>
</html>
